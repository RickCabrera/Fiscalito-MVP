name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      # Lint antes que los tests: falla en un segundo en vez de quemar la suite.
      - run: ruff check .
      - run: pytest tests/ -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # El lock vivo es el del workspace root; el de apps/store era peso muerto.
          cache-dependency-path: package-lock.json
      - run: npm ci
      # tsc + vite build: el gate mínimo de tipos del frontend
      - run: npm run build
      # Se activa al cerrar S-02 (lint frontend a cero; hoy 20 errores).
      # - run: npm run lint
      - run: npm test
