[project]
name = "fiscal-agent-api"
version = "0.1.0"
description = "Motor de inteligencia fiscal para el ecosistema Fiscalito"
authors = [{name = "Ricardo Cabrera"}]
requires-python = ">=3.11"
dependencies = [
    # Pineados: la forma del OpenAPI (docs/openapi.json, verificado en CI) depende de la
    # versión exacta de FastAPI y Pydantic. Subirlos = regenerar el contrato en el mismo PR.
    "fastapi==0.149.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic==2.14.1",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # El Hikvision manda el evento en multipart cuando adjunta la foto, asi que
    # el endpoint de asistencia tiene que poder leer form-data. Es dependencia
    # de runtime, no de tests: el dispositivo real la ejerce en la demo.
    "python-multipart>=0.0.9",
    # R-07: el backend deja de ser stateless y se vuelve dueño de la cartera.
    # Es dependencia de RUNTIME: sin ella `/api/v1/cartera/*` no puede existir.
    "firebase-admin>=6.5.0",
    # Plan P (DP-1): persistencia relacional. Postgres en Railway, SQLite en dev/tests.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Cifrado de e.firma y CSD (Fernet) y firma de solicitudes al SAT.
    "cryptography>=42.0",
    # Parser XML de la bóveda de CFDI y del web service del SAT.
    "lxml>=5.0",
    # Adaptador de almacenamiento S3/R2 para XML y PDF.
    "boto3>=1.34",
    # Exportar papeles de trabajo y reportes a Excel.
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    # Pineado: un release que estabilice reglas nuevas bajo E/F/W/I pondría
    # el CI en rojo en un PR que no tocó nada de eso.
    "ruff==0.15.13",
    "mypy>=1.0.0",
    # Solo para validar el CFDI de nomina contra los XSD del SAT versionados
    # en tests/xsd/. El generador (app/nomina_engine/cfdi_nomina_xml.py) usa la
    # stdlib a proposito: si importara lxml, se volveria dependencia de runtime
    # y habria que instalarlo en el contenedor de Cloud Run.
    # >=5.0 porque el CI corre Python 3.12 y lxml 4.9 no publica wheels cp312.
    "lxml>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# P0-01: ya no hay tests marcados `emulador` (la cartera vive en SQL y se prueba en
# CI contra la base de verdad), así que el filtro `-m "not emulador"` se retiró y
# `pytest -q` vuelve a significar "toda la suite corrió".
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
# Migraciones autogeneradas por Alembic: no se editan a mano.
extend-exclude = ["migrations/versions"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
