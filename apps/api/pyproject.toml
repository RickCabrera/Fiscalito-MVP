[project]
name = "fiscal-agent-api"
version = "0.1.0"
description = "Motor de inteligencia fiscal para el ecosistema Fiscalito"
authors = [{name = "Ricardo Cabrera"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # El Hikvision manda el evento en multipart cuando adjunta la foto, asi que
    # el endpoint de asistencia tiene que poder leer form-data. Es dependencia
    # de runtime, no de tests: el dispositivo real la ejerce en la demo.
    "python-multipart>=0.0.9",
    # R-07: el backend deja de ser stateless y se vuelve dueño de la cartera.
    # Es dependencia de RUNTIME: sin ella `/api/v1/cartera/*` no puede existir.
    "firebase-admin>=6.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    # Pineado: un release que estabilice reglas nuevas bajo E/F/W/I pondría
    # el CI en rojo en un PR que no tocó nada de eso.
    "ruff==0.15.13",
    "mypy>=1.0.0",
    # Solo para validar el CFDI de nomina contra los XSD del SAT versionados
    # en tests/xsd/. El generador (app/nomina_engine/cfdi_nomina_xml.py) usa la
    # stdlib a proposito: si importara lxml, se volveria dependencia de runtime
    # y habria que instalarlo en el contenedor de Cloud Run.
    # >=5.0 porque el CI corre Python 3.12 y lxml 4.9 no publica wheels cp312.
    "lxml>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# `-m "not emulador"` deja fuera los tests que necesitan el emulador de
# Firestore corriendo. NO se saltan —no se ejecutan, que es distinto y honesto—
# así que `pytest -q` mantiene el "cero skips" que pide el CLAUDE.md raíz y el
# conteo limpio. Se corren aparte con `pytest -m emulador` tras levantar
# `firebase emulators:start --only firestore` desde `apps/store`.
addopts = "-v --tb=short -m \"not emulador\""
markers = [
    "emulador: necesita el emulador de Firestore en FIRESTORE_EMULATOR_HOST",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
